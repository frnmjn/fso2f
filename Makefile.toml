[config]
default_to_workspace = false

[tasks.install]
description = "Install cargo-make if not already installed"
script = '''
npm -g install wgc
'''

[tasks.export-schemas]
description = "Export GraphQL schemas to files"
command = "cargo"
args = ["run", "--bin", "export-schemas"]

[tasks.docker-up]
description = "Start all services in detached mode"
script = '''
docker compose up -d
'''

[tasks.docker-down]
description = "Stop all Docker Compose services"
script = '''
docker compose down
'''

[tasks.clippy]
description = "Run clippy lints"
command = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
description = "Run tests"
command = "cargo"
args = ["test"]

[tasks.wgc-build-router]
description = "Build WonderGraph router configuration"
command = "wgc"
args = [
    "router",
    "compose",
    "-i",
    "./schemas/federation/federation-compose.yaml",
    "-o",
    "./schemas/federation/router.json",
]

[tasks.export-federated-schema]
description = "Export federated schema to GraphQL SDL"
script = '''
jq -r '.engineConfig.graphqlSchema' schemas/federation/router.json > schemas/federation/federated-schema.graphql
echo "✅ Federated schema exported to schemas/federation/federated-schema.graphql"
'''

[tasks.subgraph-create-products]
description = "Create products subgraph"
command = "wgc"
args = [
    "subgraph",
    "create",
    "products",
    "--routing-url",
    "http://products-subgraph:3001/graphql",
    "-n",
    "development",
]

[tasks.subgraph-create-orders]
description = "Create orders subgraph"
command = "wgc"
args = [
    "subgraph",
    "create",
    "orders",
    "--routing-url",
    "http://orders-subgraph:3002/graphql",
    "-n",
    "development",
]

[tasks.subgraph-create-customers]
description = "Create customers subgraph"
command = "wgc"
args = [
    "subgraph",
    "create",
    "customers",
    "--routing-url",
    "http://customers-subgraph:3003/graphql",
    "-n",
    "development",
]

[tasks.subgraph-publish-products]
description = "Publish products subgraph"
command = "wgc"
args = [
    "subgraph",
    "publish",
    "products",
    "--schema",
    "schemas/products.graphql",
    "-n",
    "development",
]

[tasks.subgraph-publish-orders]
description = "Publish orders subgraph"
command = "wgc"
args = [
    "subgraph",
    "publish",
    "orders",
    "--schema",
    "schemas/orders.graphql",
    "-n",
    "development",
]

[tasks.subgraph-publish-customers]
description = "Publish customers subgraph"
command = "wgc"
args = [
    "subgraph",
    "publish",
    "customers",
    "--schema",
    "schemas/customers.graphql",
    "-n",
    "development",
]

[tasks.dev]
description = "Run all subgraphs locally (requires PostgreSQL running)"
dependencies = [
    "docker-down",
    "export-schemas",
    "wgc-build-router",
    "docker-up",
]

[tasks.help]
description = "Show available tasks"
script = '''
echo "Available tasks:"
echo ""
echo "Development:"
echo "  cargo make install                    - Install wgc"
echo "  cargo make export-schemas             - Export GraphQL schemas"
echo "  cargo make docker-up                  - Start all services"
echo "  cargo make docker-down                - Stop all services"
echo "  cargo make dev                        - Run all subgraphs locally"
echo ""
echo "Subgraph Creation:"
echo "  cargo make subgraph-create-products   - Create products subgraph"
echo "  cargo make subgraph-create-orders     - Create orders subgraph"
echo "  cargo make subgraph-create-customers  - Create customers subgraph"
echo ""
echo "Subgraph Publishing:"
echo "  cargo make subgraph-publish-products   - Publish products subgraph"
echo "  cargo make subgraph-publish-orders     - Publish orders subgraph"
echo "  cargo make subgraph-publish-customers  - Publish customers subgraph"
echo ""
echo "Federation:"
echo "  cargo make wgc-build-router           - Build router configuration"
echo "  cargo make export-federated-schema    - Export federated schema"
echo ""
echo "Code Quality:"
echo "  cargo make clippy                     - Run lints"
echo "  cargo make test                       - Run tests"
echo ""
echo "Help:"
echo "  cargo make help                       - Show this help"
'''
