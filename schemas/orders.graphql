input CreateOrder {
	customer: CustomerInput!
	items: [CreateOrderLine!]!
}

input CreateOrderLine {
	productId: ID!
	quantity: Int!
}

type Customer @key(fields: "id") {
	id: ID!
	name: String! @shareable
	vat: String! @shareable
}

input CustomerInput {
	id: ID!
	name: String!
	vat: String!
}

type Mutation {
	createOrder(order: CreateOrder!): Order!
}

type Order {
