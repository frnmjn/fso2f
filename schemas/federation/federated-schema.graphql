schema {
  query: Query
  mutation: Mutation
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

interface Product {
  kind: String!
  code: String!
  description: String!
  id: ID!
}

type Query {
  productById(id: ID!): Product
  order(id: OrderId!): Order!
}

input CreateOrder {
  customer: CustomerInput!
  items: [CreateOrderLine!]!
}

input CreateOrderLine {
  productId: ID!
  quantity: Int!
}

type Customer {
  id: ID!
  name: String!
  vat: String!
}

input CustomerInput {
  id: ID!
  name: String!
  vat: String!
}

type Mutation {
  createOrder(order: CreateOrder!): Order!
}

type Order {
  id: OrderId!
  customer: Customer!
  totalAmount: Float!
  status: OrderStatus!
  lines: [OrderLine!]!
}

scalar OrderId

type OrderLine {
  lineNumber: Int!
  quantity: Int!
  product: Product!
}

enum OrderStatus {
  DRAFT
  CONFIRMED
  Cancelled
}

type DangerousProduct implements Product {
  id: ID!
  kind: String!
  code: String!
  description: String!
  maxTemperature: Float!
}

type ExpiringProduct implements Product {
  id: ID!
  kind: String!
  code: String!
  description: String!
  expirationDate: DateTime!
}

type StandardProduct implements Product {
  id: ID!
  kind: String!
  code: String!
  description: String!
}
