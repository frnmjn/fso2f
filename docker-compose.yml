services:
  postgres:
    environment:
      POSTGRES_DB: fso2f
      POSTGRES_PASSWORD: fso2f
      POSTGRES_USER: fso2f
    image: postgres:15
    ports:
      - "5432:5432"
    command: -c fsync=off -c full_page_writes=off
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "fso2f", "-U", "fso2f"]
      interval: 5s
      timeout: 4s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres: {}
