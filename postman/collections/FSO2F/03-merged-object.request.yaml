$kind: graphql-request
name: '03 - merged object'
url: "{{ex03}}"
query: |-
  query ($code: String!, $orderId: ID!) {
      product(code: $code) {
          id
          code
          description
      }
      order(id: $orderId) {
          id
          totalAmount
      }
  }
variables: |-
  {
    "code": "WIDGET-001",
    "orderId": "aaaa1111-aa11-4aa1-8aa1-aaaaaaaaaaaa"
  }
order: 4000
