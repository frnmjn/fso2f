[package]
name = "fso2f"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "00-monolith"
path = "src/bin/00-monolith.rs"

[[bin]]
name = "01-simple-object"
path = "src/bin/01-simple-object.rs"

[[bin]]
name = "02-complex-object"
path = "src/bin/02-complex-object.rs"

[[bin]]
name = "products-subgraph"
path = "src/bin/products-subgraph.rs"

[[bin]]
name = "orders-subgraph"
path = "src/bin/orders-subgraph.rs"

[[bin]]
name = "customers-subgraph"
path = "src/bin/customers-subgraph.rs"

[[bin]]
name = "export-schemas"
path = "src/bin/export-schemas.rs"

[[bin]]
name = "fso2f"
path = "src/bin/fso2f.rs"

[dependencies]
gix = { version = "0.68", default-features = false, features = ["blocking-network-client"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
sqlx = { version = "0.8.6", features = [
    "uuid",
    "chrono",
    "migrate",
    "postgres",
    "runtime-tokio",
] }
async-graphql-axum = "7.2.1"
async-graphql = { version = "7.2.1", features = [
    "uuid",
    "chrono",
    "dataloader",
] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
rand = "0.9.2"
chrono-tz = "0.10.4"
tokio-stream = "0.1.17"
chrono = "0.4.42"
reqwest = { version = "0.13.3", features = ["json"] }
